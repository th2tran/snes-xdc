<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web-XDC SNES Game</title>
    <style>
        /* Make the emulator take up the full chat screen */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="game-container"></div>

<script>
    // 1. Tell the emulator where the game window is
    window.EJS_player = '#game-container';

    // 2. Specify the SNES core
    window.EJS_core = 'snes';

    // 3. Point to your local ROM file
    window.EJS_gameUrl = 'game.sfc';

    // 4. CRITICAL: Point to the local 'data' folder so it doesn't use the CDN
    window.EJS_pathtodata = 'emulatorjs/data/';

    // Optional optimizations for web-xdc (hiding extra UI)
    window.EJS_startOnLoaded = true; // Auto-start the game
    window.EJS_Settings = {
        defaultControllers: {
            // Configures mobile touch controls to show automatically on phones
            "0": { "0": 1, "1": 1, "2": 1, "3": 1 }
        }
    };
</script>

<!-- Load the local emulator script -->
<script src="emulatorjs/data/loader.js"></script>
</body>
</html>
